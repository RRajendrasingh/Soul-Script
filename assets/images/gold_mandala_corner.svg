<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="35%" stop-color="#eac34a"/>
      <stop offset="70%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#8a670e"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eac34a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eac34a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#glowGrad)" />

  <g stroke="url(#goldGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Ring & Dots -->
    <circle cx="250" cy="250" r="220" stroke-width="1.5" opacity="0.4"/>
    <circle cx="250" cy="250" r="212" stroke-width="1" stroke-dasharray="3 6" opacity="0.6"/>
    <circle cx="250" cy="250" r="200" stroke-width="2" opacity="0.8"/>
    <circle cx="250" cy="250" r="185" stroke-width="1" stroke-dasharray="2 4" opacity="0.5"/>
    <circle cx="250" cy="250" r="170" stroke-width="1.5" opacity="0.7"/>

    <!-- 16 Petals Ring 1 -->
    <g opacity="0.85" stroke-width="1.5">
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(22.5 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(45 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(67.5 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(90 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(112.5 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(135 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(157.5 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(180 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(202.5 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(225 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(247.5 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(270 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(292.5 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(315 250 250)" />
      <path d="M250 50 Q270 110 250 170 Q230 110 250 50 Z" transform="rotate(337.5 250 250)" />
    </g>

    <!-- Inner Circle & Lotus Petals Ring 2 -->
    <circle cx="250" cy="250" r="130" stroke-width="2" />
    <circle cx="250" cy="250" r="115" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

    <g opacity="0.9" stroke-width="1.2">
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(30 250 250)" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(60 250 250)" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(90 250 250)" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(120 250 250)" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(150 250 250)" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(180 250 250)" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(210 250 250)" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(240 250 250)" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(270 250 250)" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(300 250 250)" />
      <path d="M250 120 Q262 165 250 210 Q238 165 250 120 Z" transform="rotate(330 250 250)" />
    </g>

    <!-- Center Sacred Geo Core -->
    <circle cx="250" cy="250" r="70" stroke-width="1.8" />
    <circle cx="250" cy="250" r="50" stroke-width="1" />
    <circle cx="250" cy="250" r="30" stroke-width="1.5" />
    <circle cx="250" cy="250" r="10" fill="url(#goldGrad)" stroke="none" />
  </g>
</svg>
