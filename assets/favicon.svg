<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft Rose-Gold Gradient Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#e4b9df"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#151215"/>
      <stop offset="100%" stop-color="#2a2027"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#151215" />

  <!-- Outer Dark Circle -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGlow)"/>

  <!-- Delicate Gradient Ring -->
  <circle cx="32" cy="32" r="24" fill="#151215" stroke="url(#ringGrad)" stroke-width="2.5"/>

  <!-- Outlined Gold Heart with Semi-transparent Inner Tint -->
  <path d="M32 44.5 L20.8 33.3 C18.3 30.8 16.5 27.6 16.5 24 C16.5 19.6 19.8 16 24.2 16 C26.8 16 29.1 17.2 30.6 19.2 L32 21.1 L33.4 19.2 C34.9 17.2 37.2 16 39.8 16 C44.2 16 47.5 19.6 47.5 24 C47.5 27.6 45.7 30.8 43.2 33.3 Z" 
        fill="rgba(234, 195, 74, 0.22)" 
        stroke="#eac34a" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
